# Миграции схемы. Строка подключения задаётся не здесь, а в backend/migrations/env.py
# из DATABASE_URL: пароль базы не должен лежать в файле под git.

[alembic]
script_location = backend/migrations
prepend_sys_path = .
path_separator = os

# Имя ревизии: дата плюс слаг — в списке видно порядок без чтения файлов.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
