# Локальная разработка. Docker Compose подхватывает этот файл автоматически,
# а Coolify собирает только по docker-compose.yml — поэтому на проде порт
# наружу не публикуется и не конфликтует с реверс-прокси.
#
# Порт задаётся через API_PORT в .env (по умолчанию 8080).

services:
  api:
    ports:
      - "${API_PORT:-8080}:8080"
